name: Monitorização Apple Podcasts três vezes por dia
on:
  schedule:
    - cron: '0 6,13,20 * * *'
      timezone: Europe/Lisbon
    # Check throughout the day so a missed collection can still be recovered later.
    # Completed slots and checks before 06:00 never consult Apple.
    - cron: '17,47 * * * *'
      timezone: Europe/Lisbon
  push:
    branches: [main]
    paths:
      - '.github/workflows/monitor.yml'
      - 'scripts/**'
      - 'tests/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apple-podcasts-archive
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar se esta ronda precisa de recolha
        id: ronda
        env:
          MONITOR_TRIGGER: ${{ github.event_name }}
        run: python scripts/schedule_guard.py
      - name: Validar coletor
        if: steps.ronda.outputs.collect == 'true'
        run: |
          python scripts/check_public_data.py
          python -m unittest discover -s tests -v
      - name: Recolher apenas classificações do podcast
        if: steps.ronda.outputs.collect == 'true'
        env:
          MONITOR_TRIGGER: ${{ github.event_name }}
          MONITOR_SCHEDULED_FOR: ${{ steps.ronda.outputs.slot }}
          MONITOR_RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/collect.py
      - name: Guardar arquivo permanente
        if: always() && steps.ronda.outputs.collect == 'true'
        run: |
          python scripts/check_public_data.py
          git config user.name 'Prazeres Interrompidos Monitor'
          git config user.email 'monitor@users.noreply.github.com'
          git add archive public
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar melhor classificação diária Apple Podcasts"
            git push
          fi

